<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home Page</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, sans-serif; padding: 24px; background: #f5f5f5; }
    h1 { font-size: 20px; margin-bottom: 8px; }
    p { color: #666; font-size: 14px; margin-bottom: 24px; }
    h2 { font-size: 16px; margin-bottom: 12px; color: #333; }
    .section { background: white; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    a {
      display: block;
      padding: 12px 16px;
      margin-bottom: 8px;
      border-radius: 8px;
      text-decoration: none;
      color: white;
      font-weight: 600;
      font-size: 14px;
    }
    a:last-child { margin-bottom: 0; }
    .universal { background: #ff6600; }
    .custom { background: #333; }
    .desc { font-size: 12px; font-weight: 400; opacity: 0.8; display: block; margin-top: 2px; }
  </style>
</head>
<body>
  <h1>Home Page</h1>

  <div class="section">
    <h2>Google Page</h2>
    <a class="universal" href="https://www.google.com">
      Go Google
      <span class="desc">https://www.google.com</span>
    </a>
  </div>


  <div class="section">
    <h2>Universal Links (https://)</h2>
    <a class="universal" href="https://superapp.uat.springdevelopmentbank.com/service-management" >
      Services Page
      <span class="desc">https://superapp.uat.springdevelopmentbank.com/service-management</span>
    </a>
    <a class="universal" href="https://superapp.uat.springdevelopmentbank.com/transactions/history" >
      Transaction History
      <span class="desc">https://superapp.uat.springdevelopmentbank.com/transactions/history</span>
    </a>
  </div>

</body>
</html>
